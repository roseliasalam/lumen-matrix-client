name: lumen-matrix-client
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/lumen-matrix-client.yml'
      - 'lumen-matrix-client.js'
      - 'package.json'

jobs:
  preflight_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Dependencies & Syntax
        run: |
          node -v
          npm -v
          echo "Preflight check passed. Launching distributed execution matrix..."

  parallel_execution:
    needs: [preflight_check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-2025
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@103.251.223.209:6188"
        - os: ubuntu-22.04
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@206.232.75.3:6573"
        - os: ubuntu-latest
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@179.61.245.171:6950"
        - os: windows-latest
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@92.112.143.29:6472"
        - os: ubuntu-24.04
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@195.40.70.40:6723"
        - os: ubuntu-20.04
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@154.6.23.176:6643"
        - os: windows-2022
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@119.42.39.148:5776"
        - os: ubuntu-latest
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@217.117.160.139:7281"
        - os: ubuntu-20.04
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@152.232.4.64:8235"
        - os: windows-2022
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@31.58.23.2:5575"
        - os: ubuntu-24.04
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@198.20.185.230:5600"
        - os: windows-latest
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@13.143.125.88:7130"
        - os: windows-2025
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@23.27.78.109:5689"
        - os: ubuntu-22.04
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@104.252.152.108:7021"
        - os: ubuntu-24.04
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@82.22.253.210:8068"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ matrix.runtime == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}

      - name: Setup Bun
        if: ${{ matrix.runtime == 'bun' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Task (Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun install
            bun run lumen-matrix-client.js "${{ matrix.proxy }}" || true
          else
            npm install
            node lumen-matrix-client.js "${{ matrix.proxy }}" || true
          fi

      - name: Run Task (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ matrix.runtime }}" -eq "bun") {
            bun install
            bun run lumen-matrix-client.js "${{ matrix.proxy }}"
          } else {
            npm install
            node lumen-matrix-client.js "${{ matrix.proxy }}"
          }

  pipeline_summary:
    needs: [parallel_execution]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Log Execution Summary
        run: |
          echo "Pipeline lumen-matrix-client finished execution at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Status: ${{ job.status }}"
