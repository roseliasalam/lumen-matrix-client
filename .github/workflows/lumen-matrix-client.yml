name: lumen-matrix-client
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/lumen-matrix-client.yml'
      - 'lumen-matrix-client.js'
      - 'package.json'

jobs:
  preflight_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Dependencies & Syntax
        run: |
          node -v
          npm -v
          echo "Preflight check passed. Launching distributed execution matrix..."

  parallel_execution:
    needs: [preflight_check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@46.203.103.200:6227"
        - os: windows-2022
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@206.232.74.30:7100"
        - os: ubuntu-22.04
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@185.101.252.39:7070"
        - os: ubuntu-20.04
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@87.239.253.55:6304"
        - os: ubuntu-latest
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@45.61.100.226:6494"
        - os: windows-2025
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@168.199.166.242:6774"
        - os: windows-latest
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@172.245.7.7:5060"
        - os: ubuntu-24.04
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@185.135.10.15:5529"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ matrix.runtime == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}

      - name: Setup Bun
        if: ${{ matrix.runtime == 'bun' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Task (Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun install
            bun run lumen-matrix-client.js "${{ matrix.proxy }}" || true
          else
            npm install
            node lumen-matrix-client.js "${{ matrix.proxy }}" || true
          fi

      - name: Run Task (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ matrix.runtime }}" -eq "bun") {
            bun install
            bun run lumen-matrix-client.js "${{ matrix.proxy }}"
          } else {
            npm install
            node lumen-matrix-client.js "${{ matrix.proxy }}"
          }

  pipeline_summary:
    needs: [parallel_execution]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Log Execution Summary
        run: |
          echo "Pipeline lumen-matrix-client finished execution at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Status: ${{ job.status }}"
