name: lumen-matrix-client
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/lumen-matrix-client.yml'
      - 'lumen-matrix-client.js'
      - 'package.json'

jobs:
  preflight_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Dependencies & Syntax
        run: |
          node -v
          npm -v
          echo "Preflight check passed. Launching distributed execution matrix..."

  parallel_execution:
    needs: [preflight_check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-2022
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@107.173.132.13:6967"
        - os: ubuntu-22.04
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@148.135.178.190:5751"
        - os: ubuntu-20.04
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@192.241.116.45:5815"
        - os: windows-2025
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@45.39.20.168:5597"
        - os: ubuntu-24.04
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@64.137.101.11:5325"
        - os: ubuntu-latest
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@64.64.118.243:6826"
        - os: windows-latest
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@31.59.10.68:5639"
        - os: ubuntu-22.04
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@45.147.186.57:6930"
        - os: windows-2022
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@45.61.116.25:6703"
        - os: windows-latest
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@94.176.212.102:6618"
        - os: ubuntu-24.04
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@82.27.245.13:6336"
        - os: ubuntu-latest
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@45.43.67.150:7900"
        - os: windows-2025
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@67.227.42.169:6146"
        - os: ubuntu-20.04
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@64.137.108.186:5779"
        - os: windows-2022
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@82.23.235.190:5514"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ matrix.runtime == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}

      - name: Setup Bun
        if: ${{ matrix.runtime == 'bun' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Task (Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun install
            bun run lumen-matrix-client.js "${{ matrix.proxy }}" || true
          else
            npm install
            node lumen-matrix-client.js "${{ matrix.proxy }}" || true
          fi

      - name: Run Task (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ matrix.runtime }}" -eq "bun") {
            bun install
            bun run lumen-matrix-client.js "${{ matrix.proxy }}"
          } else {
            npm install
            node lumen-matrix-client.js "${{ matrix.proxy }}"
          }

  pipeline_summary:
    needs: [parallel_execution]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Log Execution Summary
        run: |
          echo "Pipeline lumen-matrix-client finished execution at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Status: ${{ job.status }}"
